# Netlify picks up Next.js automatically (OpenNext adapter); this only pins
# the basics so builds don't depend on dashboard settings.
[build]
  command = "npm run build"

[build.environment]
  # Next.js 16 needs Node 20.9 or newer.
  NODE_VERSION = "22"
  # Netlify's secret scan stays fully on: no SECRETS_SCAN_* overrides. Private
  # keys stay out of the build because next.config.ts turns off Turbopack's
  # build cache (the only place they were being written).

[functions]
  directory = "netlify/functions"
